name: pr-seal-action
description: Verify a pull request, approve the verified head, and optionally enable auto-merge or merge it.
author: y-writings

inputs:
  repository:
    description: Repository in owner/name format. Defaults to the current workflow repository.
    required: false
  pull-request-number:
    description: Pull request number to verify and, when eligible, approve.
    required: true
  expected-author:
    description: Exact GitHub login expected for the pull request author. Required unless require-expected-author is false or expected-authors is set. Enforced whenever it is set.
    required: false
  expected-authors:
    description: Newline-separated GitHub logins. The author may match expected-author or any of these logins. Enforced whenever any author login is set.
    required: false
  require-expected-author:
    description: When false, and no expected-author or expected-authors value is set, any author is acceptable. Defaults to true.
    required: false
    default: "true"
  allowed-paths:
    description: Newline-separated exact file paths the pull request may change. Required unless allowed-patterns or path-preset is set. Glob syntax in this input is still literal.
    required: false
  allowed-patterns:
    description: Newline-separated glob patterns. A path is allowed when it matches an exact allowed path, one of these patterns, or the selected path preset. * and ? do not cross /, and ** crosses directories.
    required: false
  denied-patterns:
    description: Newline-separated glob patterns. A match rejects the path even when an allow path, allow pattern, or path preset would accept it.
    required: false
  path-preset:
    description: Built-in path policy. docs-and-config allows documentation and non-executable configuration and rejects workflows, scripts, lockfiles, and CI config. Implies regular-file checks. Defaults to none.
    required: false
    default: none
  require-regular-files:
    description: When true, every changed file must be a regular non-executable blob (git mode 100644) on each side of the diff the change touches. Symlinks, submodules, directories, and executable bits are rejected. Defaults to false, and docs-and-config forces it on.
    required: false
    default: "false"
  approve-token:
    description: Token used only to create or dismiss the approval review.
    required: true
  merge-token:
    description: Token used to read the pull request and git metadata, enable auto-merge, or merge the pull request.
    required: true
  merge-method:
    description: Merge method used when auto-merge is true. One of squash, merge, or rebase.
    required: false
    default: squash
  approve-body:
    description: Body for the automated approval review.
    required: false
  auto-merge:
    description: When false, approve the verified head and do not enable auto-merge or merge. Defaults to true.
    required: false
    default: "true"
  on-ineligible:
    description: When skip, an out-of-scope pull request sets eligible to false and does not fail the job. Hard errors still fail the job. Defaults to fail.
    required: false
    default: fail

outputs:
  pull-request-id:
    description: GraphQL node ID of the pull request that was read.
  head-sha:
    description: Pull request head SHA observed during verification.
  changed-files:
    description: JSON array of changed file paths considered during verification.
  approved:
    description: Whether an approval review was created.
  auto-merge-enabled:
    description: Whether auto-merge was enabled.
  merged:
    description: Whether the pull request was merged directly because GitHub reported it was already clean.
  eligible:
    description: Whether the pull request passed verification. false when on-ineligible is skip and the pull request is out of scope.
  reason:
    description: Empty when the pull request is eligible. Otherwise a single-line explanation of why it was not sealed.

runs:
  using: node24
  main: dist/index.js
